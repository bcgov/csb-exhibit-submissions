name: Build and Test API

on:
  pull_request:
    branches: ["main"]
  merge_group:
    branches: ["main"]
  push:
    branches: ["main"]
    paths:
      - api/**
      - docker/api/**
      - .github/actions/build-api/**
      - .github/workflows/build-and-test-api.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test-api:
    name: Build and Test API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for API changes
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            api:
              - api/**
              - docker/api/**
              - .github/actions/build-api/**
              - .github/workflows/build-and-test-api.yml

      - name: Build and test API
        if: steps.filter.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/build-api

      - name: Summary
        shell: bash
        run: |
          if [[ "${{ steps.filter.outputs.api }}" == "false" && "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            echo "No API changes detected."
          else
            echo "API build and tests completed."
          fi
