name: Publish Container Images
run-name: Publish Images ${{ inputs.tag || github.event.release.tag_name || github.sha }}

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish (for example, v1.2.3 or feature-abc-1234).
        required: true
        type: string
      ref:
        description: Optional branch, tag, or commit SHA to build from.
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Publish ${{ matrix.component }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            image_name: csb-exhibit-submissions/api
            dockerfile: docker/api/Dockerfile.release
          - component: web
            image_name: csb-exhibit-submissions/web
            dockerfile: docker/web/Dockerfile.release

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}

      - name: Set image tag
        id: vars
        shell: bash
        run: |
          if [[ -n "${{ inputs.tag || '' }}" ]]; then
            tag="${{ inputs.tag }}"
          elif [[ -n "${{ github.event.release.tag_name || '' }}" ]]; then
            tag="${{ github.event.release.tag_name }}"
          else
            tag="${GITHUB_SHA::12}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Lowercase repository owner
        id: owner
        shell: bash
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Setup image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.tag }}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.event_name == 'release' && github.event.release.prerelease == false }}

      - name: Build and publish API image
        if: matrix.component == 'api'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and publish web image
        if: matrix.component == 'web'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NODE_VERSION=22
            WEB_BASE_HREF=/
            NGINX_RUNTIME_SRC=./docker/nginx-runtime
            VUE_ON_NGINX_SRC=./docker/vue-on-nginx
            WEB_SRC=./web
