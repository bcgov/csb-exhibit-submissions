name: Security Image Scan

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  trivy-image:
    name: Trivy Image Scan (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [api, web]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build API image
        if: matrix.component == 'api'
        run: |
          docker build \
            -f docker/api/Dockerfile.release \
            -t csb-exhibit-submissions-api:scan .

      - name: Build web image
        if: matrix.component == 'web'
        run: |
          docker build \
            -f docker/web/Dockerfile.release \
            -t csb-exhibit-submissions-web:scan \
            --build-arg NODE_VERSION=22 \
            --build-arg WEB_BASE_HREF=/ \
            --build-arg NGINX_RUNTIME_SRC=./docker/nginx-runtime \
            --build-arg VUE_ON_NGINX_SRC=./docker/vue-on-nginx \
            --build-arg WEB_SRC=./web .

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: csb-exhibit-submissions-${{ matrix.component }}:scan
          format: sarif
          output: trivy-image-${{ matrix.component }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload Trivy image SARIF
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: trivy-image-${{ matrix.component }}.sarif
          category: trivy-image-${{ matrix.component }}
