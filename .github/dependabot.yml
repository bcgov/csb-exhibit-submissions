version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "America/Vancouver"
    cooldown:
      default-days: 30
      include:
        - "*"
    open-pull-requests-limit: 10
    groups:
      npm-non-breaking:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps(web)"
    pull-request-branch-name:
      separator: "-"
    labels:
      - "dependencies"
      - "npm"
    rebase-strategy: "auto"

  - package-ecosystem: "nuget"
    directory: "/api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:15"
      timezone: "America/Vancouver"
    open-pull-requests-limit: 10
    groups:
      dotnet-non-breaking:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps(api)"
    pull-request-branch-name:
      separator: "-"
    labels:
      - "dependencies"
      - "dotnet"
    rebase-strategy: "auto"

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:30"
      timezone: "America/Vancouver"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(docker)"
    pull-request-branch-name:
      separator: "-"
    labels:
      - "dependencies"
      - "docker"
    rebase-strategy: "auto"
