name: csb-exhibit-submissions
services:
  web:
    image: "${COMPOSE_PROJECT_NAME}-web"
    environment:
      - API_URL=${API_URL:-http://api:8080/api/}
      - WEB_BASE_HREF=${WEB_BASE_HREF:-/}
    ports:
      - 9080:8080
    depends_on:
      - api
    networks:
      - app-network

  web-dev:
    image: "${COMPOSE_PROJECT_NAME}-web-dev"
    environment:
      - API_URL=${API_URL:-http://api:8080/api/}
      - WEB_BASE_HREF=${WEB_BASE_HREF:-/}
      - APP_ENVIRONMENT=${APP_ENVIRONMENT:-dev}
      - NODE_ENV=development
      - VITE_PORT=8080
      - CHOKIDAR_USEPOLLING=true
    ports:
      - 9080:8080
    depends_on:
      - api-dev
    volumes:
      - ${LOCAL_WORKSPACE_FOLDER-..}/web/:/opt/app-root/src
      - /opt/app-root/src/node_modules
    networks:
      app-network:
        aliases:
          - web

  api:
    image: "${COMPOSE_PROJECT_NAME}-api"
    environment:
      - ASPNETCORE_URLS=${ASPNETCORE_URLS:-http://+:8080}
      - ASPNETCORE_ENVIRONMENT=Production
      - CORS_DOMAIN=${CORS_DOMAIN:-http://localhost:9080}
      - ConnectionStrings__CESDataStore=${DatabaseConnectionString}
      - EnableSwagger=${ENABLE_SWAGGER:-false}
      # Storage Configuration
      - FileStorage__LocalPath=${FileStorage__LocalPath:-/data/uploads}
      - FileStorage__AcceptedPath=${FileStorage__AcceptedPath:-/data/accepted}
      - FileStorage__Provider=${FileStorage__Provider:-Local}
      - FileStorage__MaxFileSize=${FileStorage__MaxFileSize:-104857600}
      # File Service Client Configuration
      - FileServicesClient__Username=${FileServicesClient__Username:-JcInterfaceClient}
      - FileServicesClient__Password=${FileServicesClient__Password}
      - FileServicesClient__Url=${FileServicesClient__Url}
      # Location Services Client Configuration
      - LocationServicesClient__Username=${LocationServicesClient__Username:-JcInterfaceClient}
      - LocationServicesClient__Password=${LocationServicesClient__Password}
      - LocationServicesClient__Url=${LocationServicesClient__Url}
      # Request Configuration
      - Request__ApplicationCd=${Request__ApplicationCd:-SCV}
      - Request__AgencyIdentifierId=${Request__AgencyIdentifierId}
      - Request__PartId=${Request__PartId}
      # Keycloak Configuration (Secret is never defaulted — it comes from .env only)
      - Keycloak__Enabled=${Keycloak__Enabled:-false}
      - Keycloak__Authority=${Keycloak__Authority}
      - Keycloak__Client=${Keycloak__Client}
      - Keycloak__Secret=${Keycloak__Secret}
      - Keycloak__RedirectUri=${Keycloak__RedirectUri:-http://localhost:9080/auth/callback}
      - Keycloak__PostLogoutRedirectUri=${Keycloak__PostLogoutRedirectUri:-http://localhost:9080/}
      # Data Protection key ring — must survive restarts and be shared across replicas,
      # or a restarted API cannot decrypt cookies it did not issue.
      - DataProtection__KeyPath=${DataProtection__KeyPath:-/keys}
    volumes:
      - api-data:/data
      - api-keys:/keys
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  api-dev:
    image: "${COMPOSE_PROJECT_NAME}-api-dev"
    environment:
      - ASPNETCORE_URLS=${ASPNETCORE_URLS:-http://+:8080}
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - CORS_DOMAIN=${CORS_DOMAIN:-http://localhost:9080}
      - ConnectionStrings__CESDataStore=${DatabaseConnectionString}
      - EnableSwagger=${ENABLE_SWAGGER:-false}
      # Storage Configuration
      - FileStorage__LocalPath=${FileStorage__LocalPath:-/data/uploads}
      - FileStorage__AcceptedPath=${FileStorage__AcceptedPath:-/data/accepted}
      - FileStorage__Provider=${FileStorage__Provider:-Local}
      - FileStorage__MaxFileSize=${FileStorage__MaxFileSize:-104857600}
      # File Service Client Configuration
      - FileServicesClient__Username=${FileServicesClient__Username:-JcInterfaceClient}
      - FileServicesClient__Password=${FileServicesClient__Password}
      - FileServicesClient__Url=${FileServicesClient__Url}
      # Location Services Client Configuration
      - LocationServicesClient__Username=${LocationServicesClient__Username:-JcInterfaceClient}
      - LocationServicesClient__Password=${LocationServicesClient__Password}
      - LocationServicesClient__Url=${LocationServicesClient__Url}
      # Request Configuration
      - Request__ApplicationCd=${Request__ApplicationCd:-SCV}
      - Request__AgencyIdentifierId=${Request__AgencyIdentifierId}
      - Request__PartId=${Request__PartId}
      # Keycloak Configuration (Secret is never defaulted — it comes from .env only)
      - Keycloak__Enabled=${Keycloak__Enabled:-false}
      - Keycloak__Authority=${Keycloak__Authority}
      - Keycloak__Client=${Keycloak__Client}
      - Keycloak__Secret=${Keycloak__Secret}
      - Keycloak__RedirectUri=${Keycloak__RedirectUri:-http://localhost:9080/auth/callback}
      - Keycloak__PostLogoutRedirectUri=${Keycloak__PostLogoutRedirectUri:-http://localhost:9080/}
      # Data Protection key ring — must survive restarts and be shared across replicas,
      # or a restarted API cannot decrypt cookies it did not issue.
      - DataProtection__KeyPath=${DataProtection__KeyPath:-/keys}
    networks:
      app-network:
        aliases:
          - api
    volumes:
      - ${LOCAL_WORKSPACE_FOLDER-..}/api/:/opt/app-root/src/api
      - api-dev-bin:/opt/app-root/src/api/CES.API/bin
      - api-dev-obj:/opt/app-root/src/api/CES.API/obj
      - api-temp:/opt/app-root/src/api/CES.API/uploads
      - api-data:/data
      - api-keys:/keys
    depends_on:
      db:
        condition: service_healthy
    command: >
      /bin/bash -c "
        echo Database is ready, starting API ...;
        dotnet watch run --project /opt/app-root/src/api/CES.API/CES.API.csproj --urls='http://+:8080';"

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=${POSTGRESQL_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRESQL_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRESQL_DATABASE:-cesdb}
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRESQL_USER:-postgres} -d
            ${POSTGRESQL_DATABASE:-cesdb}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  api-dev-bin:
  api-dev-obj:
  api-temp:
  api-data:
  api-keys:
  postgres-data:
