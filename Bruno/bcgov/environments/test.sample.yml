name: test
variables:
  # CES dev-bypass login (POST /api/auth/login), used by smb/Login.yml to mint an
  # Admin bearer token. Must match a DevBypassUsers record; only works when the
  # API is running with Keycloak__Enabled=false.
  - secret: true
    name: username
  - secret: true
    name: password
  - secret: true
    name: fileServices_Username
  - secret: true
    name: fileService_Password
  - name: keycloakAuthority
    value: ""
  - name: keycloakClientId
    value: ""
  - secret: true
    name: keycloakClientSecret
  - name: keycloakRedirectUri
    value: "http://localhost:9080/auth/callback"
  # No trailing /api — each request adds its own /api/... path.
  - name: apiBaseUrl
    value: ""
  - secret: true
    name: cesSessionCookie
